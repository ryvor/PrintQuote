name: Publish release
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: write
  packages: write
jobs:
  verify:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate tag and generate release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node scripts/check-release.mjs
          node scripts/release-notes.mjs RELEASE_NOTES.md
      - name: Prepare source archives
        run: |
          mkdir -p artifacts
          git archive --format=zip --prefix=printquote-${GITHUB_REF_NAME}/ HEAD > artifacts/printquote-${GITHUB_REF_NAME}.zip
          git archive --format=tar.gz --prefix=printquote-${GITHUB_REF_NAME}/ HEAD > artifacts/printquote-${GITHUB_REF_NAME}.tar.gz
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/ryvor/printquote-web:${{ github.ref_name }}
            ghcr.io/ryvor/printquote-web:latest
      - name: Build and publish API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./server/Dockerfile
          push: true
          tags: |
            ghcr.io/ryvor/printquote-api:${{ github.ref_name }}
            ghcr.io/ryvor/printquote-api:latest
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; uploading missing or updated assets."
            gh release upload "$GITHUB_REF_NAME" artifacts/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" artifacts/* --title "PrintQuote $GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md --verify-tag
          fi
