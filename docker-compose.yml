services:
  printquote:
    build: .
    container_name: printquote
    restart: unless-stopped
    depends_on:
      - printquote-api
    ports:
      - "8899:80"

  printquote-api:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: printquote-api
    restart: unless-stopped
    environment:
      PORT: "3001"
      SQLITE_PATH: /data/printquote.sqlite
      PRINTER_CATALOG_URL: ${PRINTER_CATALOG_URL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
    volumes:
      - /opt/PrintQuote/data:/data
      - /opt/PrintQuote/releases:/releases:ro
    # Internal-only: API is reachable from the frontend container, not published to the host.
