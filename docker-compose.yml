services:
  printquote:
    build: .
    container_name: printquote
    restart: unless-stopped
    depends_on:
      - printquote-api
    ports:
      - "8899:80"
    networks: [1panel-network]

  printquote-api:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: printquote-api
    restart: unless-stopped
    environment:
      PORT: 3001
      SQLITE_PATH: /data/printquote.sqlite
    volumes:
      - /opt/PrintQuote/data:/data
    networks: [1panel-network]

networks:
  1panel-network:
    external: true
